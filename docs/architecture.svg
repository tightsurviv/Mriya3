<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="From pending swap to backrun transaction" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="460" fill="#ffffff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9991"/></marker></defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1d">From pending swap to backrun transaction</text>
  <text x="24" y="52" font-size="11.5" fill="#5f5e5a">Amber boxes run on the operator side.</text>
  <rect x="24" y="172" width="712" height="144" rx="8" fill="#f3f2ee" stroke="#d9d8d2" stroke-width="1"/>
  <text x="720" y="194" text-anchor="end" font-weight="600" fill="#1f1f1d">Off-chain library (this repository)</text>
  <g fill="none" stroke="#9a9991" stroke-width="1.25">
    <path d="M140 148V212" marker-end="url(#arrow)"/>
    <path d="M380 148V212" marker-end="url(#arrow)"/>
    <path d="M240 256H280" marker-end="url(#arrow)"/>
    <path d="M480 256H520" marker-end="url(#arrow)"/>
    <path d="M620 300V364" marker-end="url(#arrow)"/>
    <path d="M520 400H480" marker-end="url(#arrow)"/>
    <path d="M280 400H240" marker-end="url(#arrow)"/>
  </g>
  <text x="148" y="168" font-size="11.5" fill="#5f5e5a">pending txs</text>
  <text x="388" y="168" font-size="11.5" fill="#5f5e5a">pool state</text>
  <text x="628" y="344" font-size="11.5" fill="#5f5e5a">unsigned bytes</text>
  <rect x="40" y="76" width="200" height="72" rx="8" fill="#e8a33d" fill-opacity="0.10" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="100" font-weight="600" fill="#1f1f1d">Orderflow relayer</text>
  <text x="56" y="116" font-size="11.5" fill="#5f5e5a">Pushes packets to a gRPC</text>
  <text x="56" y="132" font-size="11.5" fill="#5f5e5a">endpoint the operator runs</text>
  <rect x="280" y="76" width="200" height="72" rx="8" fill="#ffffff" stroke="#9a9991" stroke-width="1.25"/>
  <text x="296" y="100" font-weight="600" fill="#1f1f1d">Solana RPC</text>
  <text x="296" y="116" font-size="11.5" fill="#5f5e5a">Pool accounts polled</text>
  <text x="296" y="132" font-size="11.5" fill="#5f5e5a">by a curl process</text>
  <rect x="40" y="212" width="200" height="88" rx="8" fill="#ffffff" stroke="#9a9991" stroke-width="1.25"/>
  <text x="56" y="236" font-weight="600" fill="#1f1f1d">feed</text>
  <text x="56" y="252" font-size="11.5" fill="#5f5e5a">Decode relayer packets</text>
  <text x="56" y="268" font-size="11.5" fill="#5f5e5a">and find the victim swap,</text>
  <text x="56" y="284" font-size="11.5" fill="#5f5e5a">drive each tick</text>
  <rect x="280" y="212" width="200" height="88" rx="8" fill="#ffffff" stroke="#9a9991" stroke-width="1.25"/>
  <text x="296" y="236" font-weight="600" fill="#1f1f1d">engine &#183; sim &#183; pools</text>
  <text x="296" y="252" font-size="11.5" fill="#5f5e5a">Copy the book after the</text>
  <text x="296" y="268" font-size="11.5" fill="#5f5e5a">swap, quote in integers,</text>
  <text x="296" y="284" font-size="11.5" fill="#5f5e5a">search 2&#8211;5 hop cycles</text>
  <rect x="520" y="212" width="200" height="88" rx="8" fill="#ffffff" stroke="#9a9991" stroke-width="1.25"/>
  <text x="536" y="236" font-weight="600" fill="#1f1f1d">send &#183; keys</text>
  <text x="536" y="252" font-size="11.5" fill="#5f5e5a">Route accounts and PDAs,</text>
  <text x="536" y="268" font-size="11.5" fill="#5f5e5a">priority fit, v0 message,</text>
  <text x="536" y="284" font-size="11.5" fill="#5f5e5a">durable nonce</text>
  <rect x="520" y="364" width="200" height="72" rx="8" fill="#e8a33d" fill-opacity="0.10" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="536" y="388" font-weight="600" fill="#1f1f1d">Signer and sender</text>
  <text x="536" y="404" font-size="11.5" fill="#5f5e5a">Jito, Helius, BAM or TPU</text>
  <text x="536" y="420" font-size="11.5" fill="#5f5e5a">on the operator side</text>
  <rect x="280" y="364" width="200" height="72" rx="8" fill="#ffffff" stroke="#9a9991" stroke-width="1.25"/>
  <text x="296" y="388" font-weight="600" fill="#1f1f1d">Arb program (this repo)</text>
  <text x="296" y="404" font-size="11.5" fill="#5f5e5a">On-chain: each leg via CPI,</text>
  <text x="296" y="420" font-size="11.5" fill="#5f5e5a">then a base-profit check</text>
  <rect x="40" y="364" width="200" height="72" rx="8" fill="#ffffff" stroke="#9a9991" stroke-width="1.25"/>
  <text x="56" y="388" font-weight="600" fill="#1f1f1d">DEX programs</text>
  <text x="56" y="404" font-size="11.5" fill="#5f5e5a">Raydium, Orca, Meteora,</text>
  <text x="56" y="420" font-size="11.5" fill="#5f5e5a">Pump, Manifest and more</text>
</svg>
