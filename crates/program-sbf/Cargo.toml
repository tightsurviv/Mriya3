[package]
name = "arb-program-sbf"
version = "0.1.0"
edition = "2021"
description = "SBF entrypoint of the arbitrage program: wires arb-program logic to the Solana runtime (CPI, balances)."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"
arb-program = { path = "../program" }

[features]
# Allows building without the entrypoint (e.g. as a dependency/test); the entrypoint is on by default.
no-entrypoint = []

[dev-dependencies]
# Validates .so execution in the BPF VM (in-process BanksClient): host only, tests only.
solana-program-test = "2"
solana-sdk = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
